<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pass &amp; Park">
<title>Pass &amp; Park Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23FFD400'/%3E%3Ctext x='32' y='48' font-family='Arial' font-weight='900' font-size='46' text-anchor='middle' fill='%23111'%3EL%3C/text%3E%3C/svg%3E">
<style>
:root{--y:#FFD400;--k:#111316;--m:#5d636d;--l:#e4e4de;--s:#f4f4ef;--g:#1f9d55;--r:#c0392b;--b:#2f7cf6}
*{box-sizing:border-box}html,body{margin:0}.hide{display:none!important}
body{font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--s);color:var(--k);-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
header{position:sticky;top:0;z-index:30;background:var(--k);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));height:60px}
.lp{width:32px;height:32px;border-radius:7px;background:var(--y);color:var(--k);display:grid;place-items:center;font-weight:900;border:2px solid #fff;flex:0 0 auto}
header .t{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:#24272d;border:0;color:#fff;border-radius:10px;min-width:42px;height:40px;font-size:17px}
main{padding:14px 12px calc(96px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--l);display:flex;padding-bottom:env(safe-area-inset-bottom)}
#bottom button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11.5px;color:var(--m);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
#bottom button i{font-style:normal;font-size:22px;line-height:1}
#bottom button.on{color:var(--k);font-weight:800}
.dot{position:absolute;top:3px;left:calc(50% + 6px);background:var(--r);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-weight:700}
#side{display:none}
@media(min-width:900px){
  #bottom{display:none}
  #side{display:block;position:fixed;top:60px;left:0;bottom:0;width:230px;background:#fff;border-right:1px solid var(--l);padding:12px;overflow:auto;z-index:20}
  #side button{display:flex;width:100%;gap:12px;align-items:center;border:0;background:none;padding:11px 12px;border-radius:12px;font-size:15px;text-align:left;position:relative}
  #side button:hover{background:var(--s)}#side button.on{background:var(--k);color:var(--y);font-weight:700}
  #side .dot{position:static;margin-left:auto}
  main{margin-left:230px;max-width:none;padding:22px 30px 40px}
  main>.wrap{max-width:900px}
}
h2{font-size:21px;margin:4px 0 12px}h3{margin:0;font-size:17px}
.muted{color:var(--m);font-size:14px}.small{font-size:13px}
.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:15px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.btn{border:0;border-radius:12px;min-height:46px;padding:10px 14px;font-weight:700;font-size:15px;background:#ebebe5;color:var(--k);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.2}
.btn:active{transform:scale(.98)}
.b-y{background:var(--y)}.b-k{background:var(--k);color:#fff}.b-g{background:var(--g);color:#fff}.b-r{background:#fde8e6;color:var(--r)}.b-o{background:#fff;border:1.5px solid var(--l)}.b-b{background:var(--b);color:#fff}
.btn[disabled]{opacity:.4;pointer-events:none}.full{width:100%}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
@media(min-width:600px){.acts{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
.acts .btn{font-size:14px;padding:8px 6px;flex-direction:column;gap:2px}.acts .btn i{font-style:normal;font-size:19px}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--s);white-space:nowrap}
.Pending{background:#fff2b3}.Confirmed{background:#d9f5e4;color:#11663a}.Completed{background:#e3ecff;color:#2848a8}.Cancelled,.Declined,.No-show{background:#fde8e6;color:var(--r)}
input,select,textarea{width:100%;min-height:48px;padding:11px 12px;border:1.5px solid var(--l);border-radius:12px;font:inherit;font-size:16px;background:#fff;color:var(--k)}
textarea{min-height:90px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--k)}
label.l{display:block;font-size:13px;font-weight:700;color:var(--m);margin:12px 0 6px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}@media(min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--l);border-radius:16px;padding:13px}.stat b{display:block;font-size:24px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--l);background:#fff;border-radius:999px;padding:9px 14px;font-size:15px;min-height:44px}
.chip.on{background:var(--k);color:var(--y);border-color:var(--k);font-weight:700}.chip small{display:block;font-size:11px;opacity:.75;font-weight:400}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.day{flex:0 0 auto;min-width:66px;text-align:center;border:1.5px solid var(--l);border-radius:14px;padding:8px 6px;background:#fff}
.day small{display:block;font-size:11px;color:var(--m)}.day b{font-size:19px}.day.on{background:var(--k);color:#fff;border-color:var(--k)}.day.on small{color:#bbb}.day.none{opacity:.38}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:6px}
.times button{border:1.5px solid var(--k);background:#fff;border-radius:12px;min-height:46px;font-weight:700}.times button.on{background:var(--y)}
.dayhead{position:sticky;top:60px;z-index:5;background:var(--s);padding:10px 2px 6px;font-weight:800;font-size:15px}
.line{display:flex;gap:8px;padding:3px 0;font-size:15px}.line>span:first-child{flex:0 0 22px;text-align:center}
.qbox{background:var(--s);border-radius:14px;padding:12px;margin-top:10px}.qbox .r{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:15px}.qbox .tot{font-weight:800;font-size:17px;border-top:1px solid var(--l);margin-top:6px;padding-top:8px}
.list button.item{display:flex;width:100%;text-align:left;justify-content:space-between;gap:10px;background:#fff;border:1.5px solid var(--l);border-radius:12px;padding:11px 12px;margin-bottom:8px;align-items:center}
.list button.item.on{border-color:var(--k);background:#fffbe0}
.sw{position:relative;width:52px;height:30px;flex:0 0 auto;display:inline-block}.sw input{opacity:0;width:0;height:0;min-height:0;position:absolute}
.sw span{position:absolute;inset:0;background:#d5d5cf;border-radius:999px;transition:.2s}.sw span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw input:checked+span{background:var(--g)}.sw input:checked+span:before{transform:translateX(22px)}
.hrow{display:grid;grid-template-columns:52px 60px 1fr 1fr;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--l)}.hrow b{font-size:15px}
.hrow.off select{opacity:.35;pointer-events:none}
.flag{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;font-size:15px}
.warn{background:#fff2b3;border-radius:10px;padding:8px 10px;font-size:14px;margin-top:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(17,19,22,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:22px 22px 0 0;max-height:90vh;overflow:auto;padding:12px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}.grab{width:46px;height:5px;border-radius:9px;background:#ddd;margin:0 auto 12px}
@media(min-width:900px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:580px;border-radius:22px;padding:22px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}.sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}.grab{display:none}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--k);color:#fff;padding:12px 16px;border-radius:14px;display:none;z-index:80;max-width:92vw;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media(min-width:900px){#toast{bottom:24px}}
pre{white-space:pre-wrap;font-family:inherit;background:var(--s);padding:12px;border-radius:12px;font-size:14px;margin:8px 0 0}
details>summary{cursor:pointer;font-weight:700;padding:8px 0;list-style:none}details>summary::-webkit-details-marker{display:none}details>summary:before{content:"▸ ";color:var(--m)}details[open]>summary:before{content:"▾ "}
.sk{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--l);font-size:15px}
.stars button{border:0;background:none;font-size:24px;padding:0 1px;color:#d5d5cf;min-height:36px}.stars button.on{color:#e8a400}
.sumbar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--k);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-top:14px;z-index:6}
@media(min-width:900px){.sumbar{bottom:16px}}
.sumbar .tot{flex:1}.sumbar .tot b{font-size:20px;color:var(--y);display:block}
/* website editor */
.edbar{position:sticky;top:60px;z-index:8;background:var(--s);padding:8px 0 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.edbar .sep{flex:1}
.frame{background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;margin:0 auto;height:calc(100vh - 150px);transition:width .3s;width:100%}
.frame.phone{width:400px;max-width:100%}.frame iframe{width:100%;height:100%;border:0;display:block}
.pv{width:100%;aspect-ratio:16/10;border-radius:14px;background:#eee center/cover;border:1px solid var(--l)}
.login{max-width:380px;margin:12vh auto 0;padding:0 20px}
.empty{text-align:center;padding:28px 10px;color:var(--m)}
</style>
</head>
<body>
<header><span class="lp">L</span><span class="t" id="ttl">Pass &amp; Park Admin</span><button id="refresh" title="Refresh" class="hide">↻</button></header>
<div id="loginBox" class="login">
  <h2>Welcome back 👋</h2><p class="muted">Enter the admin PIN.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN">
  <label class="flag" style="padding:12px 0"><span>Remember me on this device</span><span class="sw"><input type="checkbox" id="remember" checked><span></span></span></label>
  <button class="btn b-k full" id="go">Open</button><p class="muted" id="lerr"></p>
</div>
<nav id="side"></nav>
<main id="app" style="display:none"></main>
<nav id="bottom" style="display:none"></nav>
<div class="sheet-bg" id="sbg"></div><div class="sheet" id="sheet"></div>
<div id="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwDzfI8GrcDGzRFAqjMM83Z2L5Dmupv8_P7K8cV6q8FGxfFqYOYhqO9dD94R6wi7sEG4w/exec';
const SITE=location.href.replace(/[^/]*$/,'');
let PIN='',D=null,TAB='inbox',CH={},BK=null,EDF=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Math.round((+n||0)*100)/100).toFixed(2).replace(/\.00$/,'');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SKILLS=['Steering & control','Mirrors & observation','Speed management','Gap selection','Intersections & roundabouts','Lane changes','Parking','Reverse / 3-point turn','Hazard awareness','Road rules'];
const TABS=[['inbox','📥','Inbox'],['lessons','📅','Lessons'],['book','➕','Book'],['students','🎓','Students'],['money','💰','Money'],['hours','🕒','Hours'],['site','🖊️','Website'],['bot','🤖','Chat bot'],['records','🗂️','Records'],['settings','⚙️','Settings']];
const BOTTOM=['inbox','lessons','book','students','more'];
function toast(m,ms){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms||3200)}
async function call(fn,args,tries=0){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'admin',fn,pin:PIN,args:args||[]})});
  const t=await r.text();let d;try{d=JSON.parse(t)}catch(e){if(tries<1&&/Load|Slots|Free/.test(fn)){await sleep(900);return call(fn,args,tries+1)}throw new Error('Google is busy — please try again')}
  if(!d.ok)throw new Error(d.error||'Error');return d.data}
async function pub(params,tries=0){const t=await (await fetch(API+'?'+new URLSearchParams(params))).text();let d;try{d=JSON.parse(t)}catch(e){if(tries<2){await sleep(1000);return pub(params,tries+1)}throw new Error('Google is busy — try again')}if(!d.ok)throw new Error(d.error||'Error');return d}
async function run(fn,args,done){toast('Working…',60000);try{const d=await call(fn,args);if(d&&d.bookings){D=d}closeSheet();render();toast(done||'Done ✓')}catch(e){toast('⚠ '+e.message,5000)}}
/* ---------- dates & times ---------- */
const pad=n=>String(n).padStart(2,'0');
const mins=t=>{const p=String(t).split(':');return +p[0]*60+(+p[1]||0)};const hh=m=>pad(Math.floor(m/60))+':'+pad(m%60);
function fmtT(t){if(!t)return '';const [h,m]=t.split(':').map(Number);return ((h%12)||12)+':'+pad(m)+(h<12?' am':' pm')}
function dObj(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmtD(s,long){if(!s)return '';const d=dObj(s);return d.toLocaleDateString('en-AU',long?{weekday:'long',day:'numeric',month:'long'}:{weekday:'short',day:'numeric',month:'short'})}
function addDays(s,n){const d=dObj(s);d.setDate(d.getDate()+n);return ymd(d)}
function topts(sel,from=300,to=1320){let h='';for(let m=from;m<=to;m+=30){const v=hh(m);h+=`<option value="${v}"${v===sel?' selected':''}>${fmtT(v)}</option>`}return h}
function relDay(s){if(s===D.today)return 'Today';if(s===addDays(D.today,1))return 'Tomorrow';return fmtD(s)}
/* ---------- login & shell ---------- */
async function login(){PIN=$('#pin').value.trim();$('#lerr').textContent='Opening…';try{D=await call('adminLoad',[]);try{if($('#remember').checked)localStorage.ssPin=PIN;else localStorage.removeItem('ssPin')}catch(e){}
  $('#loginBox').style.display='none';$('#app').style.display='';$('#bottom').style.display='';$('#refresh').classList.remove('hide');render()}catch(e){$('#lerr').textContent=e.message}}
$('#go').onclick=login;$('#pin').onkeydown=e=>{if(e.key==='Enter')login()};
try{if(localStorage.ssPin){$('#pin').value=localStorage.ssPin;login()}}catch(e){}
$('#refresh').onclick=async()=>{toast('Refreshing…');try{D=await call('adminLoad',[]);render();toast('Up to date ✓')}catch(e){toast('⚠ '+e.message)}};
function go(t){if(TAB==='site'&&Object.keys(CH).length&&t!=='site'&&!confirm('You have unsaved website changes. Leave without saving?'))return;TAB=t;closeSheet();render();scrollTo(0,0)}
function navs(){const pend=D.stats.pending;
  $('#side').innerHTML=TABS.map(([k,i,l])=>`<button class="${k===TAB?'on':''}" data-go="${k}"><span>${i}</span>${l}${k==='inbox'&&pend?`<span class="dot">${pend}</span>`:''}</button>`).join('');
  $('#bottom').innerHTML=BOTTOM.map(k=>{if(k==='more'){const on=!['inbox','lessons','book','students'].includes(TAB);return `<button class="${on?'on':''}" data-act="more"><i>☰</i>More</button>`}const t=TABS.find(x=>x[0]===k);return `<button class="${k===TAB?'on':''}" data-go="${k}"><i>${t[1]}</i>${t[2]}${k==='inbox'&&pend?`<span class="dot">${pend}</span>`:''}</button>`}).join('');
  $('#ttl').textContent=(TABS.find(x=>x[0]===TAB)||[,,'Admin'])[2]}
function render(){navs();const f={inbox:vInbox,lessons:vLessons,book:vBook,students:vStudents,money:vMoney,hours:vHours,site:vSite,bot:vBot,records:vRecords,settings:vSettings}[TAB];$('#app').innerHTML='<div class="wrap">'+f()+'</div>';(AFTER[TAB]||(()=>{}))()}
const AFTER={};
/* ---------- sheet ---------- */
function sheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('on');$('#sbg').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#sbg').classList.remove('on')}
$('#sbg').onclick=closeSheet;
/* ---------- helpers ---------- */
const B=id=>D.bookings.find(b=>b.ID===id);
const due=b=>Math.max(0,((b.Status==='Declined'||b.Status==='Cancelled')?0:+b.Total||0)+(+b['Cancel Fee']||0)-(+b['Paid Amount']||0));
const wa=p=>{p=String(p).replace(/\D/g,'');if(p[0]==='0')p='61'+p.slice(1);return 'https://wa.me/'+p};
const maps=a=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a);
const realEmail=e=>e&&!/@no-email\.local$/.test(e);
function pkgLabel(b){return b.Purchase==='test'?'Test package':b.Purchase==='credit'?'Prepaid credit':(b['Lessons Bought']+' lesson'+(b['Lessons Bought']>1?'s':'')+' @ '+money(b['Unit Price']))}
function bCard(b,o={}){
  const d=due(b),lic=[b['Licence No'],b['Licence State'],b['Licence Type']].filter(String).join(' · '),exp=b['Licence Expiry'],expired=exp&&exp<D.today;
  let h=`<div class="card"><div class="row sp" style="align-items:flex-start"><div><h3>${esc(b.Name)}</h3><div class="muted">${o.noDate?'':relDay(b.Date)+' · '}${fmtT(b.Start)} – ${fmtT(b.End)} · ${b.Hours} hr</div></div><span class="pill ${b.Status}">${b.Status}</span></div><div style="margin-top:8px">
  <div class="line"><span>📍</span><a href="${maps(b.Pickup)}" target="_blank">${esc(b.Pickup)}</a></div>${b.Dropoff&&b.Dropoff!==b.Pickup?`<div class="line"><span>🏁</span><span>${esc(b.Dropoff)}</span></div>`:''}
  <div class="line"><span>🪪</span><span>${esc(lic||'No licence given')}${exp?' · exp '+esc(exp):''}${expired?' <b style="color:var(--r)">EXPIRED</b>':''}</span></div>
  ${b['Test Centre']||b['Test Date']?`<div class="line"><span>📝</span><span>Test: ${esc([b['Test Centre'],b['Test Date'],b['Test Booking Ref']].filter(String).join(' · '))}</span></div>`:''}
  <div class="line"><span>💵</span><span>${esc(pkgLabel(b))} · travel ${money(b['Travel Fee'])} · <b>${money(b.Total)}</b> ${d?`<b style="color:var(--r)">· ${money(d)} due</b>`:'· ✓ paid'}</span></div>
  ${b['Student Notes']?`<div class="line"><span>💬</span><span>${esc(b['Student Notes'])}</span></div>`:''}</div>`;
  if(b.Status==='Confirmed'||b.Status==='Pending')h+=`<div class="flag"><span>🪪 Licence sighted & matches</span><label class="sw"><input type="checkbox" data-flag="Licence Sighted (ID check)" data-id="${b.ID}" ${b['Licence Sighted (ID check)']==='Y'?'checked':''}><span></span></label></div>
  <div class="flag" style="padding-top:0"><span>📞 Phoned & verified</span><label class="sw"><input type="checkbox" data-flag="Phone Verified" data-id="${b.ID}" ${b['Phone Verified']==='Y'?'checked':''}><span></span></label></div>`;
  h+=`<div class="acts"><a class="btn b-o" href="tel:${esc(b.Phone)}"><i>📞</i>Call</a><a class="btn b-o" target="_blank" href="${wa(b.Phone)}"><i>💬</i>WhatsApp</a><a class="btn b-o" target="_blank" href="${maps(b.Pickup)}"><i>🗺️</i>Navigate</a>`;
  if(b.Status==='Pending')h+=`<button class="btn b-g" data-act="confirm" data-id="${b.ID}"><i>✓</i>Confirm</button><button class="btn b-r" data-act="decline" data-id="${b.ID}"><i>✕</i>Decline</button>`;
  if(b.Status==='Confirmed')h+=`<button class="btn" data-act="move" data-id="${b.ID}"><i>🔁</i>Move</button><button class="btn b-r" data-act="cancel" data-id="${b.ID}"><i>✕</i>Cancel</button>`;
  if(d&&!['Pending','Declined'].includes(b.Status))h+=`<button class="btn b-y" data-act="paid" data-id="${b.ID}"><i>$</i>Mark paid</button>`;

function shrink(file){return new Promise((ok,no)=>{const img=new Image();img.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.84).split(',')[1])};img.onerror=()=>no(new Error('Could not read that image'));img.src=URL.createObjectURL(file)})}
function edPrice(p){const k=PKEY[p],lbl={one:'Single lesson',two:'2–4 lessons (each)',five:'5–9 lessons (each)',ten:'10+ lessons (each)',test:'Test package',excess:'Test package insurance excess'}[p];
  sheet(`<h2>${lbl}</h2><p class="muted">This changes the price everywhere — website, calculator, chat and real booking quotes.</p><label class="l">Price ($)</label><input id="prv" type="number" inputmode="decimal" min="0" step="1" value="${esc(cur(k)||fw().SS.P(k))}"><div class="row" style="margin-top:12px"><button class="btn b-k" data-act="edPriceOk" data-k="${k}">Set price</button><button class="btn b-o" data-act="close">Cancel</button></div>`)}
function edLink(k){const name=k.replace('social.','');sheet(`<h2>${name[0].toUpperCase()+name.slice(1)} link</h2><p class="muted">Paste the full link to your page. Leave empty to hide the icon on the website.</p><input id="lnv" placeholder="https://www.${name==='google'?'google.com/maps/…':name+'.com/…'}" value="${esc(cur(k))}"><div class="row" style="margin-top:12px"><button class="btn b-k" data-act="edLinkOk" data-k="${k}">Save link</button><button class="btn b-o" data-act="close">Cancel</button></div>`)}
function edStyle(){const y=cur('color.yellow')||'#FFD400',k=cur('color.ink')||'#111316',fh=cur('font.head')||'Sora',fb=cur('font.body')||'Inter';
  sheet(`<h2>Colours & fonts</h2><div class="g2"><div><label class="l">Brand colour</label><input type="color" id="cy" value="${esc(y)}" style="padding:4px;height:52px"></div><div><label class="l">Dark colour</label><input type="color" id="ck" value="${esc(k)}" style="padding:4px;height:52px"></div></div>
  <label class="l">Heading font</label><select id="fh">${FONTS.map(f=>`<option${f===fh?' selected':''}>${f}</option>`).join('')}</select><label class="l">Body font</label><select id="fb">${FONTS.map(f=>`<option${f===fb?' selected':''}>${f}</option>`).join('')}</select>
  <p class="muted small">Changes show in the preview straight away.</p><button class="btn b-o" data-act="edReset">Reset to original look</button> <button class="btn b-k" data-act="close">Done</button>`);
  const live=(id,key)=>$(id).oninput=e=>{CH[key]=e.target.value;edApply(fw(),key,e.target.value);edBar()};live('#cy','color.yellow');live('#ck','color.ink');live('#fh','font.head');live('#fb','font.body');$('#fh').onchange=$('#fh').oninput;$('#fb').onchange=$('#fb').oninput}
function edList(){const keys=[...new Set([...Object.keys(D.content),...Object.keys(CH)])].filter(k=>!/^(price|travel|cancel)\./.test(k)).sort();
  sheet(`<h2>All website text</h2><input id="elq" placeholder="🔎 Search…"><div id="ell" style="margin-top:10px">${keys.map(k=>{const v=cur(k);return `<div class="eli" data-q="${esc((k+' '+v).toLowerCase())}"><label class="l">${esc(k)}</label>${String(v).length>60?`<textarea data-ek="${esc(k)}">${esc(v)}</textarea>`:`<input data-ek="${esc(k)}" value="${esc(v)}">`}</div>`}).join('')}</div><button class="btn b-k full" data-act="close" style="margin-top:14px">Done</button>`);
  $('#elq').oninput=e=>{const q=e.target.value.toLowerCase();$$('.eli').forEach(x=>x.style.display=x.dataset.q.includes(q)?'':'none')};
  $$('[data-ek]').forEach(i=>i.oninput=()=>{CH[i.dataset.ek]=i.value;edApply(fw(),i.dataset.ek,i.value);edBar()})}
function edFaq(){sheet(`<h2>FAQ & chat answers</h2><p class="muted small">"Show" puts it on the website. All answers are used by the chat assistant.</p><div id="fql">${D.faq.map(f=>faqRow(f.Question,f.Answer,f.Keywords,f['Show on website (Y/N)']!=='N')).join('')}</div><button class="btn b-o full" data-act="faqAdd" style="margin-top:8px">➕ Add question</button><button class="btn b-k full" data-act="faqSave" style="margin-top:8px">Save FAQ — go live</button>`)}
function faqRow(q,a,k,show){return `<div class="card fq" style="background:var(--s)"><input class="fqq" placeholder="Question" value="${esc(q)}"><textarea class="fqa" placeholder="Answer" style="margin-top:8px">${esc(a)}</textarea><input class="fqk" placeholder="Keywords for the chat bot (comma separated)" value="${esc(k)}" style="margin-top:8px"><div class="flag"><span>Show on website</span><label class="sw"><input type="checkbox" class="fqs" ${show?'checked':''}><span></span></label></div><button class="btn b-r" data-act="faqDel">Delete</button></div>`}
/* ---------- bot / records / settings ---------- */
function vBot(){const q=D.chat.slice().reverse(),open=q.filter(c=>c['Bot Answered?']==='N'&&c['Added to FAQ?']!=='Y');
  return `<h2>Teach the chat assistant</h2><p class="muted">Questions it couldn't answer. Type the answer once — it learns it.</p>${open.map(c=>`<div class="card"><div class="muted small">${esc(c.Time)}</div><b>${esc(c.Question)}</b><textarea placeholder="Your answer…" style="margin-top:8px" id="ta${c._row}"></textarea><input placeholder="Keywords (optional)" id="tk${c._row}" style="margin-top:8px"><button class="btn b-k full" data-act="teach" data-row="${c._row}" style="margin-top:8px">Teach bot</button></div>`).join('')||'<div class="card empty">Nothing to teach right now 🎉</div>'}
  <details><summary>All chat questions (${q.length})</summary>${q.slice(0,100).map(c=>`<div class="muted small" style="padding:5px 0;border-bottom:1px solid var(--l)">${esc(c.Time)} · ${c['Bot Answered?']==='Y'?'✓':'✕'} ${esc(c.Question)}</div>`).join('')}</details>`}
function vRecords(){return `<h2>Records</h2><div class="card"><b>Legal records — kept 5 years</b><p class="muted">NSW requires each student's name, address, phone, lesson dates & times and the car rego to be kept for at least 5 years. Everything is stored in your Google Sheet automatically. Never delete rows.</p><a class="btn b-k" target="_blank" href="${esc(D.sheetUrl)}">Open records sheet</a></div>
  <div class="card"><h3>Activity log</h3>${D.events.slice().reverse().slice(0,150).map(e=>`<div class="muted small" style="padding:6px 0;border-bottom:1px solid var(--l)">${esc(e.Time)} · ${esc(e.Email||'visitor')} · <b>${esc(e.Event)}</b> ${esc(e.Detail)}</div>`).join('')}</div>`}
function vSettings(){return `<h2>Settings</h2><div class="card"><h3>Admin PIN</h3><p class="muted">Use 6+ digits. Only share it with RJ.</p><div class="row" style="flex-wrap:nowrap"><input id="npin" type="password" inputmode="numeric" placeholder="New PIN"><button class="btn b-k" data-act="pin">Change</button></div></div>
  ${D.settings.map(s=>`<div class="card"><label class="l" style="margin-top:0">${esc(s.Key)}</label><div class="muted small" style="margin-bottom:6px">${esc(s.Notes)}</div><div class="row" style="flex-wrap:nowrap"><input value="${esc(s.Value)}" id="set_${esc(s.Key)}"><button class="btn b-y" data-act="setSave" data-k="${esc(s.Key)}">Save</button></div></div>`).join('')}
  <div class="card"><h3>Add to home screen</h3><p class="muted">iPhone: Share → Add to Home Screen. Android: ⋮ → Add to Home screen. It then opens like an app.</p><button class="btn b-o" data-act="logout">Log out on this device</button></div>`}
/* ---------- actions ---------- */
const ACT={
 more(){sheet(`<h2>More</h2><div class="list">${TABS.filter(t=>!['inbox','lessons','book','students'].includes(t[0])).map(([k,i,l])=>`<button class="item" data-go="${k}"><span>${i} ${l}</span><span>›</span></button>`).join('')}</div>`)},
 close(){closeSheet()},
 confirm(d){const b=B(d.id);sheet(`<h2>Confirm lesson?</h2><p><b>${esc(b.Name)}</b><br>${fmtD(b.Date,1)} · ${fmtT(b.Start)}–${fmtT(b.End)}<br>📍 ${esc(b.Pickup)}</p><p class="muted">${realEmail(b.Email)?'The student gets a confirmation email with PayID details. ':''}It's added to your Google Calendar.</p><button class="btn b-g full" data-act="confirmOk" data-id="${b.ID}">✓ Confirm</button>`)},
 confirmOk(d){run('adminConfirm',[d.id],'Confirmed ✓')},
 decline(d){const b=B(d.id);sheet(`<h2>Decline ${esc(b.Name)}?</h2><div class="chips">${['That time is no longer available.','That address is outside our area.','Please call us to arrange a time.'].map(r=>`<button class="chip" data-act="decR" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div><label class="l">Message to student (optional)</label><textarea id="decT"></textarea><button class="btn b-r full" data-act="declineOk" data-id="${b.ID}" style="margin-top:12px">Decline booking</button>`)},
 decR(d){$('#decT').value=d.v},
 declineOk(d){run('adminDecline',[d.id,$('#decT').value],'Declined')},
 cancel(d){const b=B(d.id),c=D.content,P=k=>+c[k],hl=(dObj(b.Date).getTime()+mins(b.Start)*60000-Date.now())/3600000,st=D.students.find(s=>s.email===b.Email)||{};
  const lv=b.Purchase==='test'?+b['Unit Price']:(+b['Unit Price']||+st.creditUnit||P('price.one'))*(+b.Hours||1),pct=hl>P('cancel.free_hours')?0:hl>P('cancel.late_hours')?P('cancel.late_pct'):P('cancel.noshow_pct');
  sheet(`<h2>Cancel ${esc(b.Name)}</h2><p class="muted">${fmtD(b.Date,1)} · ${fmtT(b.Start)} · ${Math.max(0,Math.round(hl))} hrs from now</p>
  <div class="list"><button class="item" data-act="cancelOk" data-id="${b.ID}" data-w="student"><span><b>Student cancelled</b><br><span class="muted">Fee ${money(lv*pct/100)} (${pct}% by notice period)</span></span><span>›</span></button>
  <button class="item" data-act="cancelOk" data-id="${b.ID}" data-w="instructor"><span><b>I need to cancel</b><br><span class="muted">No fee for the student</span></span><span>›</span></button>
  <button class="item" data-act="cancelOk" data-id="${b.ID}" data-w="noshow"><span><b>Student didn't show</b><br><span class="muted">Fee ${money(lv*P('cancel.noshow_pct')/100)}</span></span><span>›</span></button></div>
  <label class="l">Message to student (optional)</label><textarea id="canT"></textarea><p class="muted small">Lesson hours go back on the student's account for re-booking.</p>`)},
 cancelOk(d){run('adminCancel',[d.id,d.w,$('#canT').value],'Cancelled')},
 async move(d){const b=B(d.id);sheet(`<h2>Move ${esc(b.Name)}'s lesson</h2><p class="muted">Now: ${fmtD(b.Date,1)} · ${fmtT(b.Start)}. Only times that fit around your other lessons (with drive time) are shown.</p><div id="mvd"><p class="muted">Checking the diary…</p></div><div id="mvt"></div><button class="btn b-k full" id="mvGo" data-act="moveOk" data-id="${b.ID}" disabled style="margin-top:12px">Move lesson</button>`);
  try{const days=await call('adminFreeSlotsRange',[d.id,D.today,14]);ACT._mv={days,date:'',time:''};$('#mvd').innerHTML=daysHtml(days,'','mvDay')}catch(e){$('#mvd').innerHTML='<div class="warn">'+esc(e.message)+'</div>'}},
 mvDay(d){const m=ACT._mv;m.date=d.v;m.time='';$('#mvd').innerHTML=daysHtml(m.days,d.v,'mvDay');$('#mvt').innerHTML=timesHtml(m.days.find(x=>x.date===d.v),'','mvTime');$('#mvGo').disabled=true},
 mvTime(d){const m=ACT._mv;m.time=d.v;$('#mvt').innerHTML=timesHtml(m.days.find(x=>x.date===m.date),d.v,'mvTime');$('#mvGo').disabled=false;$('#mvGo').textContent='Move to '+fmtD(m.date)+' '+fmtT(d.v)},
 moveOk(d){const m=ACT._mv;run('adminReschedule',[d.id,m.date,m.time],'Moved ✓ — student emailed')},
 paid(d){const b=B(d.id),x=due(b);sheet(`<h2>Payment from ${esc(b.Name)}</h2><p class="muted">Due: ${money(x)} · ref ${esc(b.ID)}</p><label class="l">Amount received ($)</label><input id="pdv" type="number" inputmode="decimal" value="${x}"><button class="btn b-y full" data-act="paidOk" data-id="${b.ID}" style="margin-top:12px">Mark as received</button>`)},
 paidOk(d){const v=+$('#pdv').value;if(!(v>0))return toast('Enter an amount');run('adminMarkPaid',[d.id,v],'Payment recorded ✓')},
 notes(d){const b=B(d.id);let sk={};try{sk=JSON.parse(b.Skills||'{}')}catch(e){}ACT._sk=sk;
  sheet(`<h2>Lesson notes · ${esc(b.Name)}</h2><p class="muted">${fmtD(b.Date,1)} · ${fmtT(b.Start)}</p><h3 style="margin-top:10px">Skills (tap stars)</h3>${SKILLS.map(s=>`<div class="sk"><span>${s}</span><span class="stars" data-s="${esc(s)}">${[1,2,3,4,5].map(n=>`<button class="${(+sk[s]||0)>=n?'on':''}" data-act="star" data-s="${esc(s)}" data-v="${n}">★</button>`).join('')}</span></div>`).join('')}
  <label class="l">What you covered / what to work on</label><textarea id="nN">${esc(b['Lesson Notes'])}</textarea><label class="l">Areas / route driven</label><input id="nR" value="${esc(b['Route / Areas'])}" placeholder="e.g. Thornton → East Maitland roundabouts">
  <div class="g2"><div><label class="l">Odometer start</label><input id="nO1" inputmode="numeric" value="${esc(b['Odometer Start'])}"></div><div><label class="l">Odometer end</label><input id="nO2" inputmode="numeric" value="${esc(b['Odometer End'])}"></div></div>
  <div class="g2" style="margin-top:12px"><button class="btn" data-act="notesOk" data-id="${b.ID}">Save</button><button class="btn b-k" data-act="notesOk" data-id="${b.ID}" data-done="1">Save & complete</button></div>`)},
 star(d){ACT._sk[d.s]=+d.v;$$(`.stars[data-s="${CSS.escape(d.s)}"] button`).forEach((x,i)=>x.classList.toggle('on',i<d.v))},
 notesOk(d){run('adminSaveLesson',[d.id,{skills:ACT._sk,notes:$('#nN').value,route:$('#nR').value,odoStart:$('#nO1').value,odoEnd:$('#nO2').value,complete:!!d.done}],d.done?'Lesson completed ✓':'Saved ✓')},
 bookFor(d){newBK(D.students.find(s=>s.email===d.email));go('book')},
 stuEdit(d){const s=D.students.find(x=>x.email===d.email),F=[['Name','name'],['Phone','phone'],['Address','address'],['Licence No','licence'],['Licence State','licenceState'],['Licence Type','licenceType'],['Licence Expiry','licenceExpiry','date'],['Test Centre','testCentre'],['Test Date','testDate'],['Test Booking Ref','testRef'],['DOB','dob','date'],['Emergency Contact','emergency'],['Flags / Safety Notes','flags']];
  sheet(`<h2>Edit ${esc(s.name)}</h2>${F.map(f=>`<label class="l">${f[0]}</label><input data-sk="${f[0]}" type="${f[2]||'text'}" value="${esc(s[f[1]])}">`).join('')}<button class="btn b-k full" data-act="stuOk" data-email="${esc(s.email)}" style="margin-top:12px">Save</button>`)},
 stuOk(d){const o={};$$('[data-sk]').forEach(i=>o[i.dataset.sk]=i.value);run('adminSaveStudent',[d.email,o],'Saved ✓')},
 /* booking wizard */
 bkPick(d){newBK(D.students.find(s=>s.email===d.email));render()},
 bkClear(){newBK();render()},
 async bkFind(){const q=$('#bka').value.trim();if(q.length<4)return toast('Type the street and suburb');BK.address=q;$('#bkares').innerHTML='<p class="muted">Searching…</p>';
  try{const d=await pub({action:'geocode',q});ACT._ar=d.results;$('#bkares').innerHTML=d.results.map((r,i)=>`<button class="item" data-act="bkAddrPick" data-i="${i}"><span>📍 ${esc(r.address)}</span><span>›</span></button>`).join('')||'<p class="muted">No match — add the suburb.</p>'}catch(e){$('#bkares').innerHTML='<div class="warn">'+esc(e.message)+'</div>'}},
 bkAddrPick(d){BK.address=ACT._ar[+d.i].address;BK.addrOk=true;BK.days=null;BK.quote=null;BK.date='';BK.time='';bkRefresh()},
 bkAddr(){BK.addrOk=false;BK.days=null;BK.quote=null;BK.date='';BK.time='';render()},
 async bkFindD(){const q=$('#bkd').value.trim();if(q.length<4)return;$('#bkdres').innerHTML='<p class="muted">Searching…</p>';try{const d=await pub({action:'geocode',q});ACT._dr=d.results;$('#bkdres').innerHTML=d.results.map((r,i)=>`<button class="item" data-act="bkDropPick" data-i="${i}"><span>🏁 ${esc(r.address)}</span><span>›</span></button>`).join('')}catch(e){toast('⚠ '+e.message)}},
 bkDropPick(d){BK.dropoff=ACT._dr[+d.i].address;BK.days=null;BK.time='';bkRefresh()},
 bkPkg(d){BK.purchase=d.v;if((d.v==='1'||d.v==='test')&&BK.hours==2)BK.hours=1;BK.quote=null;bkRefresh()},
 bkHrs(d){if(d.v==='2'&&(BK.purchase==='1'||BK.purchase==='test'))return toast('2-hour lessons need 2+ lessons');BK.hours=+d.v;BK.days=null;BK.time='';BK.quote=null;bkRefresh()},
 bkDay(d){BK.date=d.v;BK.time='';render()},
 bkTime(d){BK.time=d.v;render()},
 async bkGo(){const b=BK,st=b.st;const p={name:st?st.name:b.name,phone:st?st.phone:b.phone,email:st?(realEmail(st.email)?st.email:''):b.email,licence:st?st.licence:b.licence,licenceState:st?st.licenceState:b.licenceState,licenceExpiry:st?st.licenceExpiry:b.licenceExpiry,
   address:b.address,dropoff:b.dropoff,date:b.date,time:b.time,hours:b.hours,purchase:b.purchase,notes:b.notes};
  if(!p.name||!p.phone)return toast('Add the student name and mobile');
  toast('Booking…',60000);try{D=await call('adminManualBooking',[p]);BK=null;TAB='lessons';render();toast('Booked & confirmed ✓')}catch(e){toast('⚠ '+e.message,6000);bkRefresh()}},
 /* hours */
 saveHours(){const rows=[];let bad='';$$('.hrow').forEach(r=>{const on=r.querySelector('.hon').checked,s=r.querySelector('.hs').value,e=r.querySelector('.he').value;if(on&&mins(e)<=mins(s))bad=r.dataset.day;rows.push([r.dataset.day,on?s:'',on?e:''])});
  if(bad)return toast('⚠ '+bad+': finish time must be after start time');run('adminSaveTable',['Availability',rows],'Working hours saved ✓')},
 addOff(){const dt=$('#toD').value,all=$('#toAll').checked,s=$('#toS').value,e=$('#toE').value;if(!dt)return toast('Pick a date');if(!all&&mins(e)<=mins(s))return toast('⚠ "Until" must be after "From"');
  const clash=D.bookings.filter(b=>b.Date===dt&&['Confirmed','Pending'].includes(b.Status)&&(all||(mins(b.Start)<mins(e)&&mins(b.End)>mins(s))));
  if(clash.length&&!confirm(`${clash.length} lesson(s) already booked in that time (${clash.map(b=>b.Name+' '+fmtT(b.Start)).join(', ')}). Block anyway? You'll need to move or cancel them.`))return;
  const rows=D.blocked.map(b=>[b['Date (yyyy-mm-dd)'],b['Start (blank = all day)'],b.End,b.Reason]);rows.push([dt,all?'':s,all?'':e,$('#toR').value]);run('adminSaveTable',['Blocked',rows],'Time blocked ✓')},
 delOff(d){const rows=D.blocked.filter(b=>String(b._row)!==d.row).map(b=>[b['Date (yyyy-mm-dd)'],b['Start (blank = all day)'],b.End,b.Reason]);run('adminSaveTable',['Blocked',rows],'Removed ✓')},
 /* website */
 edView(d){EDF=d.v;$('#frame').classList.toggle('phone',d.v==='phone')},
 edBold(){const w=fw();if(w)w.document.execCommand('bold')},
 edStyle(){edStyle()},edList(){edList()},edFaq(){edFaq()},
 edImgOk(d){const v=$('#upu').value.trim();if(!/^https?:\/\//.test(v))return toast('Upload a photo or paste a link');edSet(d.k,v)},
 edPriceOk(d){const v=$('#prv').value;if(!(+v>=0)||v==='')return toast('Enter a number');edSet(d.k,String(+v))},
 edLinkOk(d){let v=$('#lnv').value.trim();if(v&&!/^https?:\/\//.test(v))v='https://'+v;edSet(d.k,v)},
 edReset(){['color.yellow','color.ink','font.head','font.body'].forEach(k=>CH[k]={'color.yellow':'#FFD400','color.ink':'#111316','font.head':'Sora','font.body':'Inter'}[k]);['color.yellow','color.ink','font.head','font.body'].forEach(k=>edApply(fw(),k,CH[k]));edBar();closeSheet()},
 edDiscard(){if(!confirm('Undo all unsaved website changes?'))return;CH={};render()},
 async edSave(){const n=Object.keys(CH).length;toast('Saving…',60000);try{await call('adminSaveContent',[CH]);Object.assign(D.content,CH);CH={};edBar();toast('✓ '+n+' change'+(n>1?'s':'')+' live on the website')}catch(e){toast('⚠ '+e.message,6000)}},
 faqAdd(){$('#fql').insertAdjacentHTML('beforeend',faqRow('','','',true))},
 faqDel(d,el){el.closest('.fq').remove()},
 faqSave(){const rows=$$('.fq').map(f=>[f.querySelector('.fqq').value.trim(),f.querySelector('.fqa').value.trim(),f.querySelector('.fqk').value.trim(),f.querySelector('.fqs').checked?'Y':'N']).filter(r=>r[0]&&r[1]);run('adminSaveTable',['FAQ',rows],'FAQ saved ✓')},
 /* misc */
 teach(d){const a=$('#ta'+d.row).value.trim();if(!a)return toast('Type an answer');run('adminTeach',[+d.row,a,$('#tk'+d.row).value],'Bot taught ✓')},
 setSave(d){run('adminSaveKV',['Settings',d.k,$('#set_'+CSS.escape(d.k)).value],'Saved ✓')},
 async pin(){const v=$('#npin').value.trim();if(!/^\d{6,}$/.test(v))return toast('Use 6 or more digits');toast('Saving…');try{await call('adminSaveKV',['Settings','adminPin',v]);PIN=v;try{if(localStorage.ssPin)localStorage.ssPin=v}catch(e){}toast('PIN changed ✓ — tell RJ the new PIN')}catch(e){toast('⚠ '+e.message)}},
 logout(){try{localStorage.removeItem('ssPin')}catch(e){}location.reload()}
};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();return go(g.dataset.go)}const a=e.target.closest('[data-act]');if(a&&ACT[a.dataset.act]&&!a.disabled){e.preventDefault();ACT[a.dataset.act](a.dataset,a)}});
document.addEventListener('change',e=>{const f=e.target.closest('[data-flag]');if(f)run('adminSetFlag',[f.dataset.id,f.dataset.flag,f.checked?'Y':'N'],'Saved ✓')});
addEventListener('beforeunload',e=>{if(Object.keys(CH).length){e.preventDefault();e.returnValue=''}});
</script>
